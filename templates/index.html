<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CS2 Skin Price Checker</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="shell"><section class="hero" aria-label="Cyberpunk CS2 market scene"><img src="{{ url_for('static', filename='market-hero.png') }}" alt="Neon CS2 market scene with a price dashboard"><div class="hero-glow"></div></section><p class="eyebrow">CS2 MARKET TOOL</p><h1>Skin Price Checker</h1><p class="intro">Try <em>ak stattrak neon rider ft</em>, <em>karambit fade fn</em>, or <em>sport gloves vice ft</em>.</p>
<form id="lookup-form" class="lookup-form"><label for="query">Skin name<input id="query" name="query" placeholder="e.g. ak neon rider ft" autocomplete="off" required></label><button id="submit" type="submit">Check price</button></form>
<section id="progress" class="progress" hidden aria-live="polite"><div class="progress-top"><strong>Checking live marketplaces</strong><span id="percent">0%</span></div><div class="track"><div id="bar" class="bar"></div></div><pre id="console" class="console"></pre></section><section id="results" hidden aria-live="polite"></section>
</main><script>
const form=document.querySelector('#lookup-form'),query=document.querySelector('#query'),submit=document.querySelector('#submit'),progress=document.querySelector('#progress'),consoleBox=document.querySelector('#console'),bar=document.querySelector('#bar'),percent=document.querySelector('#percent'),results=document.querySelector('#results');const esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function render(data){results.hidden=false;if(!data.item_name){const picks=(data.suggestions||[]).map(n=>`<button class="suggestion" data-name="${esc(n)}">${esc(n)}</button>`).join('');results.innerHTML=`<div class="result"><p class="eyebrow">NEED A CLEARER NAME</p><h2>${esc(data.message)}</h2><div class="suggestions">${picks}</div></div>`;document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{query.value=b.dataset.name;form.requestSubmit()});return}const rows=data.quotes.map(q=>`<article class="quote ${q.price?'available':''}"><p>${esc(q.marketplace)}</p><strong>${q.price?esc(q.price):'Unavailable'}</strong>${q.sgd_estimate?`<span class="sgd">${esc(q.sgd_estimate)}</span>`:''}<small>${esc(q.status)}${q.stock!=null?` · ${q.stock} in stock`:''}</small><a target="_blank" rel="noreferrer" href="${esc(q.url)}">Open marketplace ↗</a></article>`).join('');results.innerHTML=`<div class="result"><p class="eyebrow">EXACT MARKET MATCH</p><h2>${esc(data.item_name)}</h2><p>${esc(data.message)}</p><div class="quotes">${rows}</div></div>`}
form.addEventListener('submit',e=>{e.preventDefault();progress.hidden=false;results.hidden=true;consoleBox.textContent='';bar.style.width='4%';percent.textContent='4%';submit.disabled=true;const stream=new EventSource(`/api/lookup?query=${encodeURIComponent(query.value)}`);let count=0;stream.addEventListener('log',e=>{consoleBox.textContent+=JSON.parse(e.data).message+'\n';consoleBox.scrollTop=consoleBox.scrollHeight;count++;const value=Math.min(92,4+count*12);bar.style.width=value+'%';percent.textContent=value+'%'});stream.addEventListener('result',e=>{bar.style.width='100%';percent.textContent='100%';render(JSON.parse(e.data));submit.disabled=false;stream.close()});stream.onerror=()=>{if(stream.readyState!==EventSource.CLOSED){consoleBox.textContent+='! The connection to the checker was interrupted.\n';submit.disabled=false;stream.close()}}});
</script></body></html>
